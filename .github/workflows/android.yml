name: Build Android app

# Runs on every push to main, and whenever you press "Run workflow" on the Actions tab.
# Always builds a test APK you can install on your phone.
# Also builds a signed release bundle (.aab) for the Play Store once the signing secrets are added.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" | tail -3

      - name: Install packages
        run: npm install --no-audit --no-fund

      - name: Bundle fonts and build the game page
        run: |
          npm run fonts
          npm run build

      - name: Create the Android project
        run: |
          npx cap add android
          npx @capacitor/assets generate --android --iconBackgroundColor '#2a1840' --splashBackgroundColor '#0c0a10'

      - name: Add AdMob app ID and version number
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          APP_ID="${ADMOB_APP_ID:-ca-app-pub-3940256099942544~3347511713}"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i "s#</application>#<meta-data android:name=\"com.google.android.gms.ads.APPLICATION_ID\" android:value=\"$APP_ID\"/>\n</application>#" "$MANIFEST"
          sed -i "s#<activity#<activity android:screenOrientation=\"portrait\"#" "$MANIFEST"
          GRADLE=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$GRADLE"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$GRADLE"
          grep -n "APPLICATION_ID" "$MANIFEST"
          grep -n "version" "$GRADLE"

      - name: Sync web files and plugins
        run: npx cap sync android

      - name: Build test APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: cape-hardware-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish test APK as a direct phone download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk cape-hardware-test.apk
          gh release delete test-build --yes --cleanup-tag || true
          gh release create test-build cape-hardware-test.apk --prerelease \
            --title "Test build ${{ github.run_number }}" \
            --notes "Latest test version of Cape Hardware for your phone. Not for the Play Store."

      - name: Build signed release bundle for Google Play
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/upload.jks
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=$PWD/app/upload.jks \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
          rm app/upload.jks
      - name: Upload release bundle
        if: ${{ hashFiles('android/app/build/outputs/bundle/release/app-release.aab') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cape-hardware-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
