name: Make Play Store screenshots

# Press "Run workflow" on the Actions tab. Download "play-store-graphics" when it finishes.
on:
  workflow_dispatch:

jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund playwright@1
      - run: npx playwright install --with-deps chromium
      - run: |
          node scripts/fetch-fonts.mjs
          node scripts/build.mjs
          node scripts/store-assets.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: play-store-graphics
          path: store/out
